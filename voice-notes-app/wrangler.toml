# Thought Sorter — voice notes organized by AI
#
# Deploy (from this folder):
#   npm install
#   npx wrangler login
#   npx wrangler secret put APP_PASSCODE        # anything you'll type once on your phone
#   npx wrangler deploy
#
# Wrangler prints the app's URL. Open it on your phone and add it to your
# home screen.

name = "thought-sorter"
main = "src/index.js"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# Keep variables set in the Cloudflare dashboard (e.g. APP_PASSCODE) on deploy.
keep_vars = true

# Pack public/ into the Worker before each deploy.
[build]
command = "node scripts/bundle-public.mjs"

# Cloudflare Workers AI: free daily allowance, no API key needed.
[ai]
binding = "AI"

# Shared lists: one small free Durable Object (SQLite) per shared list.
[[durable_objects.bindings]]
name = "LISTS"
class_name = "SharedList"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SharedList"]
